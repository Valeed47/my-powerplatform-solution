name: Export Solution from Power Platform

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Export Solution from Dev Environment
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: 'https://orgd10acd81.crm.dynamics.com'
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: 'MyTestSolution'
          solution-output-file: ./exported/solution.zip
          managed: false

      - name: Unpack Solution into Files
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: ./exported/solution.zip
          solution-folder: ./solutions/MyTestSolution
          solution-type: Unmanaged
          overwrite-files: true

      - name: Commit Solution to GitHub
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add ./solutions/
          git commit -m "Exported solution: MyTestSolution"
          git push
⚠️ Just make sure:
   1. Secrets are actually added in GitHub Settings
   2. MyTestSolution schema name is correct
   3. App User is added in Power Platform Admin Center
