name: Deploy Solution to Target Environment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Deploy Managed Solution to Target
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.TPP_ENV_URL }}
          app-id: ${{ secrets.TPP_CLIENT_ID }}
          client-secret: ${{ secrets.TPP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.TPP_TENANT_ID }}
          solution-file: ./exported/solution_managed.zip
          force-overwrite: true
          publish-changes: true
